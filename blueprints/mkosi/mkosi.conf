# Base Arch Linux + btrfs + Unified Kernel Image (UKI) blueprint for siliconcordat/warp.
# Build on Linux with: mkosi --profile=vmtest build

[Distribution]
Distribution=arch
Release=rolling
Architecture=x86-64

[Output]
Format=disk
Output=warp-base
OutputDirectory=mkosi.output
ManifestFormat=json
CompressOutput=zstd

[Content]
Bootable=yes
UnifiedKernelImages=yes
Bootloader=systemd-boot
KernelCommandLine=quiet rw rootfstype=btrfs rootflags=subvol=@,compress=zstd:3 lsm=landlock,lockdown,yama,integrity,apparmor,bpf
Packages=
    base
    linux
    linux-firmware
    btrfs-progs
    systemd
    systemd-ukify
    bubblewrap
    libseccomp
    python
    git
    openssh
    tailscale
    nftables
    jq
    ca-certificates
PostInstallationScripts=mkosi.postinst

[Validation]
Checksum=yes
