# Lightweight Omarchy/Hyprland Linux desktop client profile (dedicated spare laptop only).
# Never overwrite a live production workstation; run inside QEMU or dual-boot on shared hardware.
# Runs local L4 exo, L5 mde broker, mandatory tool sandboxes, and optional small local CPU model.

[Output]
Output=warp-client-omarchy

[Content]
Packages=
    hyprland
    waybar
    wl-clipboard
    foot
    xdg-desktop-portal-hyprland
    gtk4
    gtk4-layer-shell
    pipewire
    wireplumber
    networkmanager
    wireguard-tools
