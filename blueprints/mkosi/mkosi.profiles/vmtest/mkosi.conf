# Safe QEMU/KVM acceptance profile (first target before flashing real hardware).
# Validates boot, bubblewrap/Landlock/seccomp sandboxing, warp-modeld, and btrfs/UKI rollback.

[Output]
Output=warp-vmtest

[Content]
KernelCommandLine=console=ttyS0 rw rootfstype=btrfs rootflags=subvol=@ lsm=landlock,lockdown,yama,integrity,apparmor,bpf
Packages=
    qemu-guest-agent
    util-linux
    socat
