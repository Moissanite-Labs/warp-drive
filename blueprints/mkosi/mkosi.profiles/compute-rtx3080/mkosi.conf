# Compute host profile for reversible dual-boot on 8 GiB VRAM RTX 3080 Laptop (32 GiB RAM, x64).
# Installs alongside untouched Windows 11 partition on partition 2 (~400-500 GiB btrfs).
# Target workload: 4B-8B Q4_K_M/Q8_0 multi-adapter serving via llama-server + CPU float64 adapter builds.

[Output]
Output=warp-compute-rtx3080

[Content]
KernelCommandLine=quiet rw rootfstype=btrfs rootflags=subvol=@,compress=zstd:3 nvidia-drm.modeset=1 lsm=landlock,lockdown,yama,integrity,apparmor,bpf
Packages=
    nvidia-open
    nvidia-utils
    cuda
    cmake
    ninja
    gcc
    pkgconf
    curl
    lm_sensors
