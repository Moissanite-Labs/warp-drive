name: site
# Pull request gate for the site. No network needed beyond checkout.
# Actions are pinned to commit SHAs (tag named in the trailing comment).
on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: python3 -I -B scripts/check_site.py
      - run: python3 -I -B scripts/build_expeditions.py --check
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: node --test tests/site-math.test.mjs
